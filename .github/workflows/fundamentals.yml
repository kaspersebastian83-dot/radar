name: fundamentals

on:
  schedule:
    # weekly, Saturday 05:41 UTC (statements only change with reports)
    - cron: "41 5 * * 6"
  workflow_dispatch: {}
  push:                   # new cards and holdings get business data right away
    branches: [main]
    paths: [ideas.json, portfolio.json, .github/scripts/fetch_fundamentals.py, .github/workflows/fundamentals.yml]

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet yfinance pandas

      - name: Fetch fundamentals
        run: python .github/scripts/fetch_fundamentals.py

      - name: Commit fundamentals.json
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fundamentals: update"
          for n in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
